services:
  repopulse:
    build: .
    image: repopulse:latest
    container_name: repopulse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override anything that needs to point inside the container
      DATABASE_PATH: /app/data/repopulse.db
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - repopulse-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, os, sys
          port = os.environ.get('WEBHOOK_PORT', '8000')
          urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  repopulse-data:
