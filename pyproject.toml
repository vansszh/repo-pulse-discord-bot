[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopulse"
version = "0.1.0"
description = "A modern Discord bot for real-time GitHub repository activity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RepoPulse contributors" }]
keywords = ["discord", "github", "bot", "webhook", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "discord.py>=2.4,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.26,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
repopulse = "repopulse.__main__:main"

[project.urls]
Homepage = "https://github.com/vansszh/repo-pulse"
Issues = "https://github.com/vansszh/repo-pulse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopulse = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF"]
# RUF001: we use UI emojis intentionally; treating them as "ambiguous" is noise.
# SIM105: keeping explicit try/except/pass is clearer than contextlib.suppress in a few spots.
ignore = ["E501", "RUF001", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["repopulse"]
mypy_path = "src"
